<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;

        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 45px;
            width: 60px;
            border: 2px solid black;

        }
    </style>
</head>

<body>
    <!-- Given five boxes ,Assign a random color and a random background toeach box using Dom concepts -->
    <div class="container">
        <div id="greenbox" class="box">box1 </div>
        <div id="bluebox" class="box">box2</div>
        <div id="redbox" class="box">box3</div>
        <div id="yellowbox" class="box">box3</div>
        <div id="pinkbox" class="box">box5</div>
        <div id="purplebox" class="box">box6</div>
        <div id="xyz" class="box">xyz</div>
    </div>
    <script src="index.js"></script>
</body>

</html>
