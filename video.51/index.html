<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>solution of excrise-8</title>
    <style>
        
        .container{
  height: 90vh;
            width:100vw;
            background-color: blue;

            position: relative;
            }
            .box{
                height: 60px;
                width: 60px;
                background-color: red;
                border-radius: 60px;
                position: absolute;
                left: 0;
                bottom: 0;
                animation: animateX 3s   linear  infinite,
                        animateY  3s  ease-out infinite alternate ;
            }
            @keyframes animateX {
                from{
                    left: 0%;

                }
                 to{
                    left: 100%;

                 }
                 }

            @keyframes animateY  {
                from{
                    bottom: 0%;

                }
                 to{
                 bottom: 100%;

                
                 }
                
            } 
                
        
            </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
    
</body>
</html>
