<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        * {
            font-family:Verdana, Geneva, Tahoma, sans-serif
            margin: 0;
            padding: 0;
            font-style: normal;
            line-height: 20px;
            font-optical-sizing: auto;
        }

        .card {
            border-radius: 2vw;
            margin: 0 auto;
            border: 2px solid whitesmoke;
            /* padding: 10px; */
            box-shadow: 1px 2px 3px 1px rgb(70, 66, 66);
            width: 20vw;
        }

        div img {
            padding: 1%;
            /* padding: 2px; */
            max-width: 98%;
            /* width:20vw */
            border-radius: 2.5vw;
            /* height:20px; */
        }

        .caption {
            padding-top: 4px;
            padding-left: 7%;
            word-spacing: 10px;
        }

        span {
            border: 2px solid rgb(0, 0, 0);
            padding: 1px 10px 1px 10px;
            border-radius: 20px;
        }

        .content {
            padding-left: 7%;
            padding-right: 7%;
        }

        .button {
            /* padding: 1vw;
    width: 16vw;
    height: 17vw; */
            border-radius: 2.5vw;
            display: block;
            justify-self: center;
            text-align: center;
            padding-bottom: 10px;
            /* margin:2px; */
        }

        button {
            border: 2px solid white;
            border-radius: 5vw;
            padding: 1vw 2vw 1vw 2vw;
            background-color: #e0efff;
            color: #1582ff;
        }

        .heading {
            color: #0e2632;
        }

        .para {
            color: #a5aeb9;
        }

        /* .image { */
        /* border-radius: 100px;
            margin: 2px;
            padding: 3px;

            width: 10px;
            height: 10px; */
        */ */
    </style>
</head>

<body>

    <div class="card">
        <div class="image">
            <img src="card.png" alt="">
        </div>
        <div class="caption">
            <span> Natural</span>
            <span> Lake</span>
        </div>
        <div class="content">
            <div class="heading">
                <h2> Logo di Braies</h2>
                <div class="para">
                    <p> Lorem ipsum, dolor sit amet consectetur adipisicing elit. Delectus tenetur excepturi neque
                        doloremque earum quisquam, reprehenderit, consectetur fugit </p>
                </div>
            </div>
            <div class="button">
                <button> Read more</button>
            </div>
            Add more thought about Nature
        </div>

</body>

</html>
