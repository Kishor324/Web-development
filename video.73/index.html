        #videocardcontainer {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;

}

.thumbnail {
    position: relative;
    width: 320px;
    height: 180px;
    background-size: cover;
    background-position: center;
    border-radius: 8px;
    overflow: hidden;
}

.badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background-color: red;
    color: white;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    font-weight: bold;
}

.duration {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background-color: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 2px 6px;
    font-size: 12px;
    border-radius: 4px;
}

.text-section {
    width: 320px;
    padding: 8px 0;
}

.title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
    color: #000;
}
