<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Boxmodle</title>
<style>
    .box{
        background-color: aqua;

    }
    *{
        margin: 0;
        padding: 0;
    }
    .box1{
        background-color: blue;
     padding: 15px;
     margin: 25px;
     border: 2px solid blue;
     height: 200px;
     box-sizing:border-box;

    }
     .box2{
        background-color: brown;
        padding: 25px;
     margin: 25px;
     border: 2px solid black;
     height: 200px;
     box-sizing:border-box;

     }
</style>
</head>

<body>
    <div class="box box2"> I am Box1 </div>
    <div class="box box2"> I am Box2 </div>

</body>

</html>
